<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HadiX Nexus - لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #e5e7eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glow-effect:hover {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            border-color: #10b981;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto text-center mb-10">
        <h1 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 mb-2">
            🎮 محرك جمبرة الألعاب - HadiX
        </h1>
        <p class="text-gray-400 text-sm md:text-base">اختر اللعبة، ضع التوكن الخاص بك، واطلق المحرك بثوانٍ.</p>
    </div>

    <div class="max-w-md mx-auto mb-8 relative">
        <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400">
            <i class="fas fa-search"></i>
        </span>
        <input type="text" id="searchBox" onkeyup="searchGames()" placeholder="ابحث عن اسم اللعبة هنا..." 
               class="w-full bg-gray-900 border border-gray-700 rounded-xl py-3 pr-10 pl-4 text-white focus:outline-none focus:border-emerald-500 text-right">
    </div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="gamesContainer">
        </div>

    <div class="text-center mt-16 text-gray-500 text-xs tracking-wider border-t border-gray-800 pt-6">
        ✨ ─── [ MADE BY HADI ABBOUD ] ─── ✨
    </div>

    <script>
        // قائمة الألعاب الاحترافية الكاملة الخاصة بك المأخوذة من لستة فريدا
        const gamesList = [
            { name: "Merge Gardens", package: "Merge Gardens" },
            { name: "Empires⚔️", package: "Empires⚔️" },
            { name: "Board Adventure", package: "Board Adventure" },
            { name: "Animals ＆ Coins", package: "Animals ＆ Coins" },
            { name: "Merge Dragons!", package: "MergeDragons!" },
            { name: "Sunshine Island", package: "Sunshine Island" },
            { name: "Match Factory", package: "Match Factory" },
            { name: "Coin Master", package: "Coin Master" },
            { name: "Travel Town", package: "Travel Town" },
            { name: "Dice Dreams", package: "Dice Dreams" },
            { name: "Panthia", package: "Panthia" },
            { name: "Toon Blast", package: "Toon Blast" },
            { name: "Toy Blast", package: "Toy Blast" },
            { name: "Township", package: "Township" },
            { name: "Gardenscapes", package: "Gardenscapes" },
            { name: "Homescapes", package: "Homescapes" },
            { name: "Domino Dreams", package: "Domino Dreams" },
            { name: "Disney Solitaire", package: "Disney Solitaire" },
            { name: "Klondike", package: "Klondike" },
            { name: "Yarn Loop!", package: "Yarn Loop!" },
            { name: "Goblins Wood", package: "Goblins Wood" },
            { name: "Raid", package: "Raid" },
            { name: "Merge Studio", package: "Merge Studio" },
            { name: "Big Cash Bingo / Cash Legends", package: "Big Cash Bingo" },
            { name: "Family Island", package: "Family Island" },
            { name: "Screw Guru", package: "Screw Guru" },
            { name: "Cashwalk", package: "Cashwalk" },
            { name: "Love & Pies", package: "Love & Pies" },
            { name: "Age of Coins", package: "Age of Coins" },
            { name: "Blackjack", package: "Blackjack" },
            { name: "Farmville 2", package: "Farmville 2" },
            { name: "Solitaire Grand Harvest", package: "Solitaire Grand Harvest" },
            { name: "Game Of Vampires", package: "Game Of Vampires" },
            { name: "Slime Castle", package: "Slime Castle" },
            { name: "Myths of Moonrise", package: "Myths of Moonrise" },
            { name: "Rummy Rush Card Classic", package: "Rummy Rush Card Classic" },
            { name: "Puzzles and Chaos", package: "Puzzles and Chaos" },
            { name: "Mergedome", package: "Mergedome" },
            { name: "Coin Chef", package: "Coin Chef" },
            { name: "Vikings", package: "Vikings" },
            { name: "Gin Rummy", package: "Gin Rummy" },
            { name: "Color Wood", package: "Color Wood" },
            { name: "Doomsday / Vikings Valhalla", package: "Doomsday" },
            { name: "Best Fiends", package: "Best Fiends" },
            { name: "Survival", package: "Survival" }
        ];

        // دالة بناء الكروت ديناميكياً لتوفير المساحة وتسهيل التعديل
        const container = document.getElementById('gamesContainer');
        gamesList.forEach((game, index) => {
            const card = document.createElement('div');
            card.className = 'game-card bg-gray-950 border border-gray-800 rounded-2xl p-5 transition-all duration-300 glow-effect text-right';
            card.innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <span class="bg-emerald-950 text-emerald-400 text-xs font-bold px-2.5 py-1 rounded-lg border border-emerald-800/50">
                        <i class="fas fa-gamepad ml-1"></i> جاهز للربط
                    </span>
                    <h3 class="text-lg font-bold text-white">${game.name}</h3>
                </div>
                <div class="space-y-3">
                    <input type="text" id="token-${index}" placeholder="أدخل توكن اللعبة هنا..." 
                           class="w-full bg-gray-900 border border-gray-700 rounded-xl py-2 px-3 text-sm text-gray-300 text-left focus:outline-none focus:border-emerald-500">
                    <button onclick="launchJumper('${game.name}', ${index})" 
                            class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-medium py-2 rounded-xl text-sm transition-all duration-200 shadow-md">
                        بدء الجمبرة 🚀
                    </button>
                </div>
            `;
            container.appendChild(card);
        });

        // دالة تشغيل الجمبرة وإرسال البيانات
        function launchJumper(gameName, id) {
            const tokenInput = document.getElementById(`token-${id}`).value;
            if (!tokenInput) {
                alert(`⚠️ الرجاء إدخال التوكن الخاص بلعبة ${gameName} أولاً!`);
                return;
            }
            
            // هنا يتم إرسال التوكن واسم اللعبة للسيرفر أو البوت الخاص بك لتشغيل سكربت Frida بالخلفية
            alert(`🚀 جاري تشغيل محرك الجمبرة لـ ${gameName}..\n🔑 التوكن: ${tokenInput}`);
            
            // مثال للربط البرمجي مستقبلاً عبر API:
            // fetch('https://your-api.com/jump', { method: 'POST', body: JSON.stringify({ game: gameName, token: tokenInput }) });
        }

        // دالة البحث الفوري داخل الألعاب
        function searchGames() {
            const input = document.getElementById('searchBox').value.toLowerCase();
            const cards = document.getElementsByClassName('game-card');
            
            gamesList.forEach((game, index) => {
                if (game.name.toLowerCase().includes(input)) {
                    cards[index].style.display = "";
                } else {
                    cards[index].style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
